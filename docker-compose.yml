services:
  image-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_EVENT_EXCHANGE: ${MINIO_EVENT_EXCHANGE}
      MINIO_EVENT_ROUTING_KEY: ${MINIO_EVENT_ROUTING_KEY}
      OPTIMIZER_UPLOAD_QUEUE: ${OPTIMIZER_UPLOAD_QUEUE}
      OPTIMIZER_EVENT_EXCHANGE: ${OPTIMIZER_EVENT_EXCHANGE}
      OPTIMIZER_EVENT_ROUTING_KEY: ${OPTIMIZER_EVENT_ROUTING_KEY}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@localhost:5672"
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret
    secrets:
      - minio_secret
    networks:
      - s3-image-optimizer-net

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - s3-image-optimizer-net

  rabbitmq-init:
    image: curlimages/curl:8.12.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      MINIO_EVENT_EXCHANGE: ${MINIO_EVENT_EXCHANGE}
      MINIO_EVENT_ROUTING_KEY: ${MINIO_EVENT_ROUTING_KEY}
      OPTIMIZER_UPLOAD_QUEUE: ${OPTIMIZER_UPLOAD_QUEUE}
      OPTIMIZER_EVENT_EXCHANGE: ${OPTIMIZER_EVENT_EXCHANGE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        VHOST_ENCODED="%2F"

        echo "Waiting for RabbitMQ Management API to be online..."
        until curl -s -u "$$RABBITMQ_USER:$$RABBITMQ_PASS" "http://rabbitmq:15672/api/overview" >/dev/null; do
          sleep 2
        done

        echo "Declaring Exchange: $$MINIO_EVENT_EXCHANGE"
        curl -fsS -u "$$RABBITMQ_USER:$$RABBITMQ_PASS" \
          -H "content-type: application/json" \
          -X PUT "http://rabbitmq:15672/api/exchanges/$$VHOST_ENCODED/$$MINIO_EVENT_EXCHANGE" \
          -d '{"type":"topic","durable":true}'

        echo "Declaring Queue: $$OPTIMIZER_UPLOAD_QUEUE"
        curl -fsS -u "$$RABBITMQ_USER:$$RABBITMQ_PASS" \
          -H "content-type: application/json" \
          -X PUT "http://rabbitmq:15672/api/queues/$$VHOST_ENCODED/$$OPTIMIZER_UPLOAD_QUEUE" \
          -d '{"durable":true}'

        echo "Creating Binding between $$MINIO_EVENT_EXCHANGE and $$OPTIMIZER_UPLOAD_QUEUE with routing key: $$MINIO_EVENT_ROUTING_KEY"
        curl -fsS -u "$$RABBITMQ_USER:$$RABBITMQ_PASS" \
          -H "content-type: application/json" \
          -X POST "http://rabbitmq:15672/api/bindings/$$VHOST_ENCODED/e/$$MINIO_EVENT_EXCHANGE/q/$$OPTIMIZER_UPLOAD_QUEUE" \
          -d "{\"routing_key\":\"$$MINIO_EVENT_ROUTING_KEY\"}"

        if [ -n "$$OPTIMIZER_EVENT_EXCHANGE" ]; then
          echo "Declaring Outbound Exchange: $$OPTIMIZER_EVENT_EXCHANGE"
          curl -fsS -u "$$RABBITMQ_USER:$$RABBITMQ_PASS" \
            -H "content-type: application/json" \
            -X PUT "http://rabbitmq:15672/api/exchanges/$$VHOST_ENCODED/$$OPTIMIZER_EVENT_EXCHANGE" \
            -d '{"type":"topic","durable":true}'
        else
          echo "No Outbound Exchange (OPTIMIZER_EVENT_EXCHANGE) configured. Skipping."
        fi

        echo "RabbitMQ initialization completed successfully!"
    restart: "no"
    networks:
      - s3-image-optimizer-net

  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    ports:
      - "${MINIO_PORT}:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - minio:/data
    networks:
      - s3-image-optimizer-net
    secrets:
      - minio_secret
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret
      MINIO_NOTIFY_AMQP_ENABLE_primary: "on"
      MINIO_NOTIFY_AMQP_URL_primary: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      MINIO_NOTIFY_AMQP_EXCHANGE_primary: ${MINIO_EVENT_EXCHANGE}
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_primary: topic
      MINIO_NOTIFY_AMQP_ROUTING_KEY_primary: ${MINIO_EVENT_ROUTING_KEY}
      MINIO_NOTIFY_AMQP_DURABLE_primary: "on"
      MINIO_NOTIFY_AMQP_DELIVERY_MODE_primary: "2"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_BUCKET: public
    secrets:
      - minio_secret
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        MINIO_SECRET_KEY=$$(cat /run/secrets/minio_secret)
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc event rm --force "local/$$MINIO_BUCKET" || true
        mc event add "local/$$MINIO_BUCKET" "arn:minio:sqs::primary:amqp" --event put
        mc event list "local/$$MINIO_BUCKET"
    restart: "no"
    networks:
      - s3-image-optimizer-net

secrets:
  minio_secret:
    file: ./.docker/secrets/storage_secret_key.txt

networks:
  s3-image-optimizer-net:
    driver: bridge

volumes:
  rabbitmq:
    driver: local
  minio:
    driver: local
